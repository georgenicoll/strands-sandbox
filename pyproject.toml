[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-sandbox"
version = "0.1.0"
description = "Playing around with strands"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strands-agents[ollama]>=1.35.0",
    "strands-agents-tools>=0.4.1",
]

[project.scripts]
strands = "strands_sandbox.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_sandbox"]
