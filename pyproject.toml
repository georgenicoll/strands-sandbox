[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands"
version = "0.1.0"
description = "Playing around with strands"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strands-agents[ollama]>=1.28.0",
    "strands-agents-tools>=0.2.21",
]

[project.scripts]
strands = "strands.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strands"]
